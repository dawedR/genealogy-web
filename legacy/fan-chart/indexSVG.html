<script type="text/javascript">//<![CDATA[

var uniqueCities = [];
var data = {};
let svg;


window.onload=function(){

	  // Tableau global pour accumuler les noms complets des villes
var main = document.getElementById('main'),
    chartStyle = document.getElementById('chartStyle'),
    chartLegend = document.getElementById('chartLegend'),
    chart, zpd;

	// clear content on first load
	const chartSvg = document.getElementById('chart');
	chartSvg.innerHTML = '<g id="viewport"></g><g class="city-legend"></g>';
  
  // Taille interne du SVG
  const svgWidth  = 297;
  const svgHeight = 210;

  // On récupère et on rend responsive
  svg = d3.select('#chart')
    .attr('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
	


  const viewport = svg.select('#viewport');

  // Calcul de la zone de tracé utile
  const plotWidth  = svgWidth  - 60 * 2;
  const plotHeight = svgHeight - 60 * 2;

  // Échelles prêtes à l’emploi
  const xScale = d3.scaleLinear().range([0, plotWidth]);
  const yScale = d3.scaleLinear().range([plotHeight, 0]);

  // Axes vides (sera mis à jour dans updateChart)
  viewport.append('g')
    .attr('class', 'x-axis')
    .attr('transform', `translate(0, ${plotHeight})`);
  viewport.append('g')
    .attr('class', 'y-axis');

  // Titre SVG
  svg.append('text')
  .attr('id', 'chart-title')
  .attr('x', 170)           // mm
  .attr('y', 8)            // mm
  .attr('text-anchor', 'middle')
  .attr('dominant-baseline', 'hanging')
  .style('font-family', 'sans-serif')
  .style('font-size', '4')  
	.style('font-weight', 'bold')  

  // Conteneur légende vide
  svg.append('g')
    .attr('class', 'city-legend');
 	
	let populatedOrigin = document.querySelector('label[for=origin] + .choices');
	if(populatedOrigin) populatedOrigin.outerHTML = '<select name="origin" id="origin"></select>';
	let populatedPalette = document.querySelector('label[for=palette] + .choices');
	if(populatedPalette) populatedPalette.outerHTML = '<select name="palette" id="palette"></select>';

	/**
	 * SETTINGS
	 */
	var settings = {
		generations : document.getElementById('generations'),
		origin : document.getElementById('origin'),
		txtSpace : document.getElementById('txtSpace'),
		genSpace : document.getElementById('genSpace'),
		palettes : document.getElementById('palette'),
		labelNbr : document.getElementById('labelNbr'),
		globCols : document.getElementById('globCols'),
		titleTpl : document.getElementById('titleTemplate'),
		indivTpl : document.getElementById('indivTemplate'),
		autosize : document.getElementById('autosize'),
		highlights : document.getElementById('highlights'),
		displayOrigin: document.getElementById('displayOrigin'),
		uppercaseNames: document.getElementById('uppercaseNames'),
		compPct: document.getElementById('compPct'),
		showEmptySlices: document.getElementById('showEmptySlices')
	};
	window.fetchCoords = async function() {
	  try {
		const response = await fetch('city_coords.json');
		if (!response.ok) throw new Error('Erreur de chargement');
		return await response.json();
	  } catch (error) {
		console.error('Erreur lors du chargement des coordonnées des villes:', error);
		return [];
	  }
	};
	window.updateCityLegend = async function() {
	  const legendG = svg.select('g.city-legend');
	  const labelSize = 1;
	  const max = Number(settings.labelNbr.value);
	  if (max === 0) return;
	  
	  legendG
	  .attr('transform', 'translate(10,40)')  // coin haut-gauche en (10 mm,35 mm)
	  .selectAll('*').remove();
	  
	  legendG.	append('text')
		.attr('class', 'legend-header')
		.attr('x', 0)
		.attr('y', 0)
		.style('font-family', 'sans-serif')
		.style('font-size', labelSize+'px')
		.style('font-weight', 'bold')
		.text('Ville de naissance (par distance à Lavigny) :');
	  
	  
		// 1) Filtrer les individus actuellement affichés
		  //    On prend data.ancestors, on retire les null, et si
		  //    displayOrigin.checked == false, on enlève la souche (i=0).
		  const displayedCount = Math.pow(2, settings.generations.value+1) -1 ;
		const ancestors = data.ancestors.slice(0, displayedCount).filter((indiv, i) => {
		  if (!indiv) return false;
		  if (i === 0 && !settings.displayOrigin.checked) return false;
		  return true;
		});

		  // 2) Compter les occurrences par ville (on garde que le nom avant la virgule)
		  const counts = {};
		  ancestors.forEach(indiv => {
			const raw = (indiv.NLIEU || '').split(',')[0].trim();
			if (!raw) return;
			counts[raw] = (counts[raw] || 0) + 1;
		  });
	  const coords = await window.fetchCoords();
	  const refCoord = coords[0]; // Coordonnées de Lavigny
	  const refRegion = refCoord.city.split(',')[3].trim();
	  const refPays = refCoord.city.split(',')[4].trim();
	  
	  // Obtenir les n villes les plus représentées
	  const top = Object.entries(counts)
		.map(([city, cnt]) => ({ city, cnt }))
		.sort((a, b) => b.cnt - a.cnt)
		.slice(0, max);

	  // Calculer la distance de chaque ville par rapport à Lavigny
	  const citiesWithDistance = top.map(({ city, cnt }) => {
		const cityData = coords.find(c => c.city.split(',')[0].trim() === city);
		const distance = cityData ? haversine(refCoord.lat, refCoord.lon, parseFloat(cityData.lat), parseFloat(cityData.lon)) : Infinity;
		var cityLegend = city;
		if (cityData) {
			const cityRegion = cityData.city.split(',')[3].trim();
			if (cityRegion !== refRegion) {
				const cityPays = cityData.city.split(',')[4].trim();
				if (cityPays !== refPays) 
					cityLegend = city + ' (' + cityRegion + ', ' + cityPays + ')';
				else 
					cityLegend = city + ' (' + cityRegion + ')';
			}
		} 
		return { city, cityLegend, cnt, distance };
	  }).sort((a, b) => a.distance - b.distance);

	  citiesWithDistance.forEach(({ city, cityLegend }, i) => {
		const cls    = 'NVILLE' + cssnamify(city.split(' - ')[1] || city);
		const pathEl = document.querySelector(`.slice.${cls} path`);
		if (!pathEl) return;
		const color  = getComputedStyle(pathEl).getPropertyValue('fill');

		const y      = labelSize*1.8 + i * labelSize*1.8;             // espace entre chaque item
		const itemG  = legendG.append('g')
		  .attr('class', 'legend-item')
		  .attr('transform', `translate(0,${y})`);

		// petit carré coloré
		itemG.append('rect')
		  .attr('x', 0)
		  .attr('y', -1*labelSize)      // pour centrer verticalement le texte
		  .attr('width', labelSize)
		  .attr('height', labelSize)
		  .attr('fill', color);

		// texte de légende
		itemG.append('text')
		  .attr('x', 2)
		  .attr('y', -1)       // même repère vertical que le carré
		  .style('font-family', 'sans-serif')
		  .style('font-size', labelSize+'px')
		  .style('font-weight', 'normal')
		  .text(cityLegend);
	  });
	  	  
	};

	
	
	settings.origin.addEventListener('change', switchOrigin);
	settings.labelNbr.addEventListener('change', () => {
  updateCityLegend();
  filterLabels();
});settings.displayOrigin.addEventListener('change', updateChart);
	settings.uppercaseNames.addEventListener('change', updateChart);
	settings.compPct.addEventListener('change', updateChart);
	settings.showEmptySlices.addEventListener('change', updateChart);
	
	
	[].forEach.call(document.querySelectorAll('input.chartUpdate'), function(el) {
	  el.addEventListener('change', updateChart);
	});
	[].forEach.call(document.querySelectorAll('input'), function(el) {
	  el.addEventListener('change', function () {
		updateTitle();
		el.setAttribute('value', el.value);
	  });
	});

	settings.titleTpl.addEventListener('input', function (el) {
	  updateTitle();
	  settings.titleTpl.innerHTML = settings.titleTpl.value;
	});
	settings.indivTpl.addEventListener('change', function (el) {
	  updateIndivTexts();
	  updateChart();
	  settings.indivTpl.innerHTML = settings.indivTpl.value;
	});

autosize(document.getElementsByTagName('textarea'));

// fit chart on print


/**
 * HELPERS
 */
function truncText ( str, n, useWordBoundary ){
  var isTooLong = str.length > n,
      s_ = isTooLong ? str.substr(0,n-1) : str;
  s_ = (useWordBoundary && isTooLong) ? s_.substr(0,s_.lastIndexOf(' ')) : s_;
  return  isTooLong ? s_ + '...' : s_;
}
function truncWords ( str, n, showFirstLetter, sep ){
  var splitted = str.split(' '),
      out = str;
  if (splitted.length > n) {
    out = splitted.slice(0, n).join(' ');
    out += showFirstLetter ? ' ' + splitted[n].substring(0, 1) : '';
    out += sep;
  }
  return out;
}
function truncByComma(str) {
  return str.split(',')[0].trim();
}
function radians (degrees) {
  return degrees * Math.PI / 180;
}
function setDefault (obj, def) {
  for (var key in def) {
    if(obj[key] === undefined)
      obj[key] = def[key];
  }
  return obj;
}





/**
 * MAIN
 */
originChoices = false;
palettesChoices = false;
highlightsChoices = false;

var dataStr = document.getElementById('dataStr');
retrieveContent();

window.addEventListener('dragover',function(e){
  e = e || event;
  e.preventDefault();
},false);
window.addEventListener('drop', function(e) {
  e = e || event;
  e.stopPropagation();
  e.preventDefault();
  var f = e.dataTransfer.files[0],
      reader = new FileReader();

  reader.onload = parseFileContent;
  reader.readAsText(f);
}, false);

function retrieveContent () {
  if(!dataStr.innerText.length) return;
  data = JSON.parse(dataStr.innerText);
  registerIndivs();
  registerOrigin();
  updateTitle();
  updateIndivTexts();
  updateAncestors();
  updateChart();
}

function parseFileContent (e) {
  e = e.target.result.replace(/\r/g,'\r\n');
  data.tree = parseGedcom.parse(e);
  if(!data.tree.length) return;

  data.tags = [];
  data.indi = [];
  data.sour = {};

  data.tree.forEach(function (el) {
    switch(el.tag) {
      case 'INDI':
        data.indi.push(el); break;
      case 'SOUR':
        data.sour[el.pointer] = getData(el, 'TITL').data;
        break;
      default: break;
    }
  });

  data.indi.map(parseIndividual);

  registerIndivs();
  registerOrigin();
  updateTitle();
  updateIndivTexts();
  updateAncestors();
  updateChart();
}

function registerIndivs () {
  var opt = [];
  data.indi.forEach( function(indi, i) {
    opt.push({value:i, label:indi.NOMF+' '+indi.PRNM});
  });

  if(originChoices) originChoices.destroy();

  originChoices = new Choices(settings.origin, {
    choices: opt,
    shouldSort: false,
    itemSelectText: ''
  });
}
function registerOrigin () {
  settings.origin.value = Math.min(data.indi.length-1, settings.origin.value);
  data.origin = data.indi[settings.origin.value];
}
function switchOrigin () {
  registerOrigin();
  updateAncestors();
  updateTitle();
  updateChart();
  
}

function updateChart() {

  data.usedtags = {};

  chart = drawChart(data.ancestors, {
    fontSize: 7,
    txtSpace: Number(settings.txtSpace.value),
    genSpace: Number(settings.genSpace.value)
  });
  
  applyCityColors();
  updateCityLegend();
  

  document.body.classList.add('loaded');

  dataStr.innerText = JSON.stringify(data);
}




function filterLabels() {
  const max = Number(settings.labelNbr.value);
  const lis = chartLegend.querySelectorAll('li');
  lis.forEach((li, i) => {
    // on affiche seulement les premiers max éléments
    li.style.display = i < max ? 'flex' : 'none';
  });
}

/**
 * TREE PROCESSING
 */
function updateAncestors () {
  data.ancestors = [data.origin];
  var start, end, parents;
  for (var cont = true, gen = 0; cont && gen <= 20; gen++)
  {
    start = Math.floor(Math.pow(2, gen-1));
    end = Math.pow(2, gen);
    cont = false;
    for (var i = start; i < end; i++)
    {
      parents = getParents(data.ancestors[i]);
      data.ancestors.push(parents[0] || null);
      data.ancestors.push(parents[1] || null);
      if(parents.length) cont = true;
    }
  }
}
function getParents (indiv)
{
  if(!indiv) return [];

  // find family where indiv is child
  var indivFamilyID = indiv.tree.find(function (el) {
     return el.tag == 'FAMC';
  });
  if(indivFamilyID === undefined) return [];

  var indivFamily = data.tree.find(function (el) {
     return el.pointer == indivFamilyID.data;
  });
  if(indivFamily === undefined) return [];

  // get parents IDs of that family
  var parents = [];
  var parentA = indivFamily.tree.find(function (el) {
     return el.tag == 'HUSB';
  });
  var parentB = indivFamily.tree.find(function (el) {
     return el.tag == 'WIFE';
  });

  // get parents
  if(parentA !== undefined) {
    parents.push(data.indi.find(function (el) {
      return el.pointer == parentA.data;
    }));
  }
  if(parentB !== undefined) {
    parents.push(data.indi.find(function (el) {
      return el.pointer == parentB.data;
    }));
  }

  return parents;
}

function parseIndividual (indiv, id) {
  indiv.id = id;
  indiv.tags = [];
  indiv.classes = [];
  indiv.GID = indiv.pointer;
  indiv.SQUA = 0;
  var exclude = ['FAMC', 'EVEN', 'CHAN', 'BAPM', 'NOTE', 'BOJE'];
  indiv.tree.forEach(function (event) {
    if (~exclude.indexOf(event.tag)) return;
    switch (event.tag) {
      case 'NAME': registerName(indiv, event); break;
      case 'SOUR': registerSource(indiv, event); break;
      case 'BIRT': registerEvent(indiv, event, 'N'); break;
      case 'DEAT': registerEvent(indiv, event, 'D'); break;
      default: registerEvent(indiv, event); break;
    }
    if(event.tag !== 'BIRT') registerAge(indiv, event);
  });
  indiv.tags.forEach(function(tag){
    registerTagClass(indiv, tag);
  });
  registerTagClass(indiv, 'SQUA', indiv.SQUA);
  registerTagClass(indiv, 'NLIEU');
  registerLifeArea(indiv);
  
  return indiv;
}
function updateIndivTexts () {
  var notempty = function (el, i) {
      return el.trim().length > 0;
    },
    lines = settings.indivTpl.value.split('\n').filter(notempty);

  data.indi.forEach( function(el) {
    el.texts = [];
    for (var i = 0; i < lines.length; i++) {
      el.texts.push(parseTextTemplate(lines[i], el));
    }
  });
}
function updateTitle () {
  //document.getElementById('title').innerHTML = parseTextTemplate(settings.titleTpl.value, data.origin).join(' ');
  const txt = parseTextTemplate(settings.titleTpl.value, data.origin).join(' ');
  svg.select('#chart-title').text(txt);
}
function registerEvent (indiv, event, prefix) {
  registerPlace(indiv, event);
  registerPlace(indiv, event, prefix);
  registerSource(indiv, event);
  registerSource(indiv, event, prefix);
  registerDate(indiv, event, prefix);

  if(!prefix)
    registerValue(indiv, event.tag, event.data, false);
}
function registerName(indiv, nameobj) {
  // Récupérer le contenu de la balise NAME (ex. "Marie Virginie /Michaud/")
  var fullName = nameobj.data;
  var nomf = "";       // Pour NOMF : nom de famille (entre slashs)
  var firstnamePart = "";  // Pour PRNS : partie avant les slashs (prénoms administratifs)
  
  // Extraire la partie entre slashs pour le nom de famille
  var surnameMatch = fullName.match(/\/(.*?)\//);
  if (surnameMatch) {
    nomf = surnameMatch[1].trim();
    // On retire la partie entre slashs pour obtenir la partie des prénoms
    firstnamePart = fullName.replace(/\/.*?\//, "").trim();
  } else {
    // S'il n'y a pas de slash, toute la chaîne est considérée comme prénoms
    firstnamePart = fullName.trim();
  }
  
  // Pour PRNS : découper la partie donnée en tokens (séparés par espaces)
  // et les joindre avec ", " pour obtenir par exemple "Marie, Virginie"
  var firstnamesTokens = firstnamePart.split(/\s+/);
  var prns = firstnamesTokens.join(', ');
  
  // Enregistrer NOMF et PRNS
  registerValue(indiv, 'NOMF', nomf, false);
  registerValue(indiv, 'PRNS', prns, false);
  
  // Déclaration de la variable pour récupérer GIVN (prénom d'usage tel que renseigné)
  var prus = "";
  if (nameobj.tree && nameobj.tree.length > 0) {
    nameobj.tree.forEach(function(child) {
      if (child.tag === 'GIVN') {
        prus = child.data.trim();
        registerValue(indiv, 'PRUS', prus, false);
      }
    });
  }
  
  // Pour PRNM (prénom d'usage utilisé dans l'affichage) :
  // Si prus (issu de GIVN) est non vide, on l'utilise, sinon on prend le premier token de PRNS.
  var prnm = prus.length > 0 ? prus : (prns.split(", ")[0] || "");
  registerValue(indiv, 'PRNM', prnm, false);
}


function registerDate (indiv, event, prefix) {

  var svg = doc.children[0];
  var defs = svg.children[0].children[2];

  appendStyles(doc, defs);

  saveFile(svg);
}

function getSVG() {
  var svg = document.getElementById("chart");
  svg.setAttribute('version', '1.1');
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  svg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

  var cls = document.getElementById("main").getAttribute('class');
  if (cls) {
    svg.setAttribute('class', cls);
  }

  return svg.outerHTML;
}

function exportCityList() {
  const fileContent = uniqueCities.join("\n");
  const blob = new Blob([fileContent], {type: "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "city_list.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}


function appendStyles(doc, defs) {
  var styles = document.getElementsByTagName("style");
  for (var index = 0; index < styles.length; index++) {
    var text = styles[index].innerHTML;

    const style = doc.createElement("style");
    style.setAttribute('type', 'text/css');
    var cdata = doc.createCDATASection(text);
    style.appendChild(cdata);
    defs.appendChild(style);
  }
}

function saveFile (svg) {
  var markup = svg.outerHTML.replaceAll(' xmlns=""', '');
  const blob = new Blob([markup]);
  const element = document.createElement("a");
  element.download = "fanchart.svg";
  element.href = window.URL.createObjectURL(blob);
  element.click();
  element.remove();
}

function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon / 2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function computeBearing(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }
    function normalizeDistance(d) {
      if (d < 10) return d/10*0.25;
      if (d < 30) return 0.25 + (d-10)/20*0.25;
      if (d < 150) return 0.5 + (d-30)/120*0.25;
      return 0.75 + Math.min((d-150)/500, 0.25);
    }
    function computeColor(distance, dMin, dMax, bearing) {
      const norm = normalizeDistance(distance);
      let hueStart, hueRange;
      if (norm < 0.25) { hueStart=90; hueRange=60; }
      else if (norm < 0.5) { hueStart=150; hueRange=60; }
      else if (norm < 0.75) { hueStart=210; hueRange=60; }
      else { hueStart=270; hueRange=90; }
      const localNorm = (norm % 0.25) / 0.25;
      const hue = (hueStart + localNorm*hueRange) % 360;
      const sat = 70 - norm*20;
      const light = 42 + (bearing/360)*12;
      return `hsl(${hue},${sat}%,${light}%)`;
    }
    function cssnamify(str) {
	  if (Array.isArray(str)) {
		str = str[0]; // on garde seulement le premier lieu
	  }
	  if (typeof str !== 'string') return '';
	  return '_' + str.trim().toLowerCase().normalize('NFD')
		.replace(/[\u0300-\u036f]/g, '')
		.replace(/[^a-z0-9]/g, s => s == ' ' ? '-' : '');
	}
    function applyCityColors() {
      	 fetch('city_coords.json')
        .then(r => r.json())
        .then(coords => {
          const refPlace = data.origin.NLIEU;
          const refCoord = coords.find(c => c.city === refPlace);
          if (!refCoord) return;
          const dists = coords.map(c => haversine(refCoord.lat, refCoord.lon, c.lat, c.lon));
          const dMin = Math.min(...dists), dMax = Math.max(...dists);
          let styleContent = '';
          coords.forEach(c => {
            const d = haversine(refCoord.lat, refCoord.lon, c.lat, c.lon);
            const b = computeBearing(refCoord.lat, refCoord.lon, c.lat, c.lon);
            const color = computeColor(d, dMin, dMax, b);
            const cls = 'NLIEU' + cssnamify(c.city);
			styleContent += `.slice.${cls} path{fill:${color}}`;
          });
          let el = document.getElementById('cityColorStyle');
          if (!el) {
            el = document.createElement('style'); el.id = 'cityColorStyle'; document.head.appendChild(el);
          }
          el.innerText = styleContent;
		  updateCityLegend();
        });
    }
	
	function exportPdf() {
  // 1) Crée le PDF à partir de jsPDF
  const pdf = new window.jsPDF({ unit:'mm', format:'a0', orientation:'landscape' });

  // 2) Récupère et clone ton <svg>
  const svgEl = document.querySelector('#svg-wrapper svg');
  const clone = svgEl.cloneNode(true);

  // 3) Injecte tes <style> dans le clone (pour que les CSS soient embarquées)
  const xmlns = "http://www.w3.org/2000/svg";
  let defs = clone.querySelector('defs');
  if (!defs) {
    defs = document.createElementNS(xmlns, 'defs');
    clone.insertBefore(defs, clone.firstChild);
  }
  document.querySelectorAll('style').forEach(style => {
    defs.appendChild(style.cloneNode(true));
  });

  // 4) Appelle pdf.svg sur le clone, en lui passant les dimensions du PDF
  const vb = clone.viewBox.baseVal;
clone.setAttribute('width',  vb.width);
clone.setAttribute('height', vb.height);
clone.querySelectorAll('.slice path').forEach(path => {
  path.setAttribute(
    'fill',
    getComputedStyle(path).getPropertyValue('fill')
  );
});pdf.svg(clone, {
  x: 0, y: 0,
  width:  pdf.internal.pageSize.getWidth(),
  height: pdf.internal.pageSize.getHeight()
}).then(() => pdf.save('fanchart_A0.pdf'));
}
